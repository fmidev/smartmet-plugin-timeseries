dbDriverFile = "/usr/lib64/libsmartmet-delfoi.so";

// This configuration has loadStations enabled, so the engine serializes the
// stations it read from the test database into this file. The path is relative to
// this directory, and it must stay inside the test tree: pointing it at the
// packaged test data made "make testdatabase" overwrite stations.txt in
// /usr/share/smartmet/test/data, breaking the tests of every other suite on the
// machine.
serializedStationsFile = "../tmp/stations_testdb.txt";

@include "database_info_testdb.conf"

database_driver_info:
(
	{ # Oracle driver read data from all tables
		name = "oracle_fmi_observations";
		tables = ["observation_data", "weather_data_qc","flash_data"];
		caches = ["spatialite_testdb_cache:observation_data,weather_data_qc,flash_data"];
		active = true;
	}
);

@include "observation_common.conf"
